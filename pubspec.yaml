name: cantillana_incidencias
description: Gestión de incidencias municipales – Ayuntamiento de Cantillana
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Estado reactivo
  get: ^4.6.6

  # Navegación declarativa
  go_router: ^14.2.7

  # Formateo de fechas
  intl: ^0.19.0

  # Iconos de Material
  cupertino_icons: ^1.0.8

  # Selección de imágenes desde galería/cámara
  image_picker: ^1.0.0

  # Permisos de sistema (cámara, galería)
  permission_handler: ^11.4.0

  # Carga eficiente de imágenes
  cached_network_image: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/cantillan.png