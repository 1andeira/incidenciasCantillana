name: cantillana_incidencias
description: Gestión de incidencias municipales – Ayuntamiento de Cantillana
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Estado reactivo
  get: ^4.6.6

  url_launcher: ^6.3.2
  # Navegación declarativa
  go_router: ^17.2.0

  # Formateo de fechas
  intl: ^0.20.2

  # Iconos de Material
  cupertino_icons: ^1.0.8

  # Selección de imágenes desde galería/cámara
  image_picker: ^1.0.0

  # Permisos de sistema (cámara, galería)
  permission_handler: ^12.0.1

  # Carga eficiente de imágenes
  cached_network_image: ^3.2.0
  google_maps_flutter: ^2.17.0
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/cantillan.png
